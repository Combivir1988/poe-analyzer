<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POE Analyzer — promo tile source</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: "Amazon Ember", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1b2431 0%, #232f3e 60%, #2d3d52 100%); color: #fff; position: relative; }
  .icon { position: absolute; left: 34px; top: 62px; width: 118px; height: 118px; border-radius: 24px; background: #232f3e;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1); }
  .icon .shaft { position: absolute; left: 50px; top: 22px; width: 18px; height: 40px; background: #ff9900; }
  .icon .head { position: absolute; left: 31px; top: 57px; width: 0; height: 0;
    border-left: 28px solid transparent; border-right: 28px solid transparent; border-top: 27px solid #ff9900; }
  .icon .tray { position: absolute; left: 26px; top: 89px; width: 66px; height: 11px; background: #fff; }
  .txt { position: absolute; left: 180px; top: 64px; width: 240px; }
  .txt h1 { margin: 0; font-size: 34px; line-height: 1.05; }
  .txt h1 span { color: #ff9900; }
  .txt p { margin: 12px 0 0; font-size: 14px; line-height: 1.4; color: #d5d9d9; }
  .tag { position: absolute; left: 180px; bottom: 40px; font-size: 11px; color: #9aa5b1; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="icon"><div class="shaft"></div><div class="head"></div><div class="tray"></div></div>
  <div class="txt">
    <h1>POE <span>Analyzer</span></h1>
    <p>Amazon Product Opportunity Explorer niche → one JSON file. Metrics, ASINs, search terms, trends, Top Niche Insights.</p>
  </div>
  <div class="tag">Local only · nothing leaves your browser</div>
</body>
</html>
